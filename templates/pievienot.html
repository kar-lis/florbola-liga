{% extends "pamats.html" %}
{% block content %}
 
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Pievienot spēli</h4>
    <a href="/speles" class="btn btn-sm btn-outline-secondary">← Atpakaļ</a>
</div>
 
<div class="card" style="max-width:560px;">
    <div class="card-header">Jauns rezultāts</div>
    <div class="card-body">
        <form action="/piev_speli" method="POST">
            <div class="mb-3">
                <label class="form-label">Līga</label>
                <select class="form-select" name="liga_id" required>
                    <option value="" disabled selected>Izvēlieties līgu</option>
                    {% for liga in ligas %}
                        <option value="{{ liga.id }}">{{ liga.nosaukums }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Vārti mājiniekiem</label>
                <input type="number" class="form-control" name="majas_varti"
                       min="0" placeholder="piem. 5" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Vārti viesiem</label>
                <input type="number" class="form-control" name="viesi_varti"
                        min="0" placeholder="piem. 3" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Spēles datums</label>
            <input type="date" class="form-control" name="datums" required>
        </div>
        <button type="submit" class="btn w-100 text-white" style="background:#cc0000;">
            Saglabāt
        </button>
    </form>
    </div>
</div>
 
{% endblock %}

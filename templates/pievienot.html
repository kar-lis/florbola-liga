{% extends "pamats.html" %}
{% block content %}
 
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Pievienot spēli</h4>
    <a href="/speles" class="btn btn-sm btn-outline-secondary">← Atpakaļ</a>
</div>
 
<div class="card" style="max-width:560px;">
    <div class="card-header">Jauns rezultāts</div>
    <div class="card-body">
        <form action="/piev_speli" method="POST">
            <div class="mb-3">
                <label class="form-label">Līga</label>
                <select class="form-select" name="liga_id" required>
                    <option value="" disabled selected>Izvēlieties līgu</option>
                    {% for liga in ligas %}
                        <option value="{{ liga.id }}">{{ liga.nosaukums }}</option>
                    {% endfor %}
                </select>
            </div>

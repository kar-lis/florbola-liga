{% extends "pamats.html" %}
{% block content %}
 
<style>
.auth-wrap {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}
.auth-karte {
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 10px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.auth-virsraksts {
    text-align: center;
    margin-bottom: 1.75rem;
}
.auth-virsraksts h2 {
    font-size: 22px;
    font-weight: 700;
    color: #212529;
    margin-bottom: .25rem;
}
.auth-virsraksts p {
    font-size: 14px;
    color: #6c757d;
    margin: 0;
}
.auth-karte .form-label {
    font-size: 13px;
    font-weight: 600;
    color: #495057;
}
.auth-karte .form-control,
.auth-karte .form-select {
    border-radius: 6px;
    border: 1px solid #ced4da;
    font-size: 14px;
    padding: 9px 12px;
}
.auth-karte .form-control:focus,
.auth-karte .form-select:focus {
    border-color: #cc0000;
    box-shadow: 0 0 0 3px rgba(204,0,0,0.1);
}
.btn-sarkana {
    background: #cc0000;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    transition: background .2s;
}
.btn-sarkana:hover { background: #aa0000; }
.auth-apaksa {
    text-align: center;
    margin-top: 1.25rem;
    font-size: 13px;
    color: #6c757d;
}
.auth-apaksa a { color: #cc0000; text-decoration: none; font-weight: 600; }
.auth-apaksa a:hover { text-decoration: underline; }
.ikona-aplis {
    width: 52px; height: 52px;
    background: #fff0f0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 22px;
}
</style>

<div class="auth-wrap">
    <div class="auth-karte">
        <div class="auth-virsraksts">
            <div class="ikona-aplis">🏒</div>
            <h2>Izveidot profilu</h2>
            <p>Reģistrējies, lai sekotu savai līgai</p>
        </div>
 
        <form action="/registreties" method="POST">
            <div class="mb-3">
                <label class="form-label">Tavs vārds</label>
                <input type="text" class="form-control" name="vards"
                       placeholder="Kā tevi saukt?" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Lietotājvārds</label>
                <input type="text" class="form-control" name="lietotajs"
                       placeholder="Unikāls lietotājvārds" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Kas esi?</label>
                <select class="form-select" name="loma">
                    <option value="skatitajs">Skatītājs</option>
                    <option value="speletajs">Spēlētājs</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Parole</label>
                <input type="password" class="form-control" name="parole"
                       placeholder="Izvēlies drošu paroli" required>
            </div>
            <button type="submit" class="btn-sarkana">Izveidot profilu</button>
        </form>
 
        <div class="auth-apaksa">
            Jau ir konts? <a href="/pieteikties">Ieiet šeit!</a>
        </div>
    </div>
</div>
 
{% endblock %}

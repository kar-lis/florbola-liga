{% extends "pamats.html" %}
{% block content %}
 
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-success">
            <div class="card-body">
                <h2 class="text-center mb-4">Reģistrēties</h2>
                <form action="/registreties" method="POST">
 
                    <div class="mb-3">
                        <label for="reg_vards" class="form-label">Tavs vārds</label>
                        <input type="text" class="form-control" id="reg_vards" name="vards"
                               placeholder="Kā tevi saukt?" required>
                    </div>
 
                    <div class="mb-3">
                        <label for="reg_user" class="form-label">Lietotājvārds</label>
                        <input type="text" class="form-control" id="reg_user" name="lietotajs"
                               placeholder="Tavs unikālais lietotājvārds" required>
                    </div>
 
                    <div class="mb-3">
                        <label for="reg_loma" class="form-label">Kas esi?</label>
                        <select class="form-select" id="reg_loma" name="loma">
                            <option value="skatitajs">Skatītājs</option>
                            <option value="speletajs">Spēlētājs</option>
                        </select>
                    </div>
 
                    <div class="mb-3">
                        <label for="reg_pw" class="form-label">Parole</label>
                        <input type="password" class="form-control" id="reg_pw" name="parole"
                               placeholder="Izvēlies drošu paroli" required>
                    </div>
 
                    <button type="submit" class="btn btn-success w-100">Izveidot profilu</button>
                </form>
                <p class="mt-3 text-center small">
                    Jau ir konts? <a href="/pieteikties">Ieiet šeit!</a>
                </p>
            </div>
        </div>
    </div>
</div>
 
{% endblock %}

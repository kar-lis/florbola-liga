{% extends "pamats.html" %}
{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger mx-auto" style="max-width: 500px;">
        <h4 class="alert-heading"><i class="bi bi-exclamation-triangle"></i> Vai tiešām dzēst spēli?</h4>
        <hr>
        <p class="mb-3">
            Jūs gatavojaties neatgriezeniski dzēst šo rezultātu: <br>
            <strong>{{ spele.majas }} {{ spele.majas_varti }}:{{ spele.viesi_varti }} {{ spele.viesi }}</strong> <br>
            <small class="text-muted">Datums: {{ spele.datums }}</small>
        </p>
        
        <form method="POST">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Jā, dzēst</button>
                <a href="{{ url_for('sakums') }}" class="btn btn-secondary">Atcelt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
